image:
  - Visual Studio 2022
  - Ubuntu
environment:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
for:
  -
    matrix:
      only:
        - image: Visual Studio 2022
    build_script:
      - appveyor DownloadFile https://dot.net/v1/dotnet-install.ps1
      - pwsh: ./dotnet-install.ps1 -JSonFile src/global.json -Architecture x64 -InstallDir 'C:\Program Files\dotnet'
      - dotnet build src --configuration Release
      - dotnet run --project src/SponsorCheck.Tests --configuration Release --no-build
      - dotnet build IntegrationTests --configuration Release
      - dotnet run --project IntegrationTests/IntegrationTests --configuration Release --no-build
  -
    matrix:
      only:
        - image: Ubuntu
    build_script:
      - sh: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          chmod +x dotnet-install.sh
          sudo ./dotnet-install.sh --jsonfile src/global.json --architecture x64 --install-dir /usr/share/dotnet
      - dotnet build src --configuration Release
      - dotnet run --project src/SponsorCheck.Tests --configuration Release --no-build
      - dotnet build IntegrationTests --configuration Release
      - dotnet run --project IntegrationTests/IntegrationTests --configuration Release --no-build
on_failure:
  - pwsh: |
      $root = (Get-Location).Path
      Get-ChildItem *.received.* -Recurse | % {
        $rel = $_.FullName.Substring($root.Length + 1)
        Push-AppveyorArtifact $_.FullName -FileName $rel
      }
test: off
artifacts:
  - path: nugets/*.nupkg
